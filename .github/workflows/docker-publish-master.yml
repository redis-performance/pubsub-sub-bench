name: Docker Publish - Master

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'js/**'
      - '.github/workflows/unit-tests.yml'
      - '.github/workflows/codeql-analysis.yml'
      - '.github/workflows/release-drafter.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/redis-performance/pubsub-sub-bench

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Git metadata
      id: meta
      run: |
        GIT_SHA=$(git rev-parse HEAD)
        GIT_DIRTY=$(git diff --no-ext-diff 2>/dev/null | wc -l)
        echo "git_sha=${GIT_SHA}" >> $GITHUB_OUTPUT
        echo "git_dirty=${GIT_DIRTY}" >> $GITHUB_OUTPUT
        echo "short_sha=${GIT_SHA:0:7}" >> $GITHUB_OUTPUT

    - name: Extract metadata for Docker
      id: docker_meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=latest
          type=raw,value=master-{{sha}}
          type=raw,value=master-{{date 'YYYYMMDD-HHmmss'}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.docker_meta.outputs.tags }}
        labels: ${{ steps.docker_meta.outputs.labels }}
        build-args: |
          GIT_SHA=${{ steps.meta.outputs.git_sha }}
          GIT_DIRTY=${{ steps.meta.outputs.git_dirty }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate summary
      run: |
        echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
        echo "**Repository:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Tags:** ${{ steps.docker_meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo "**Git SHA:** \`${{ steps.meta.outputs.git_sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "[View on GHCR](https://github.com/orgs/redis-performance/packages/container/package/pubsub-sub-bench)" >> $GITHUB_STEP_SUMMARY
